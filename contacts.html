<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Главная</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="row">
    <div class="col-2" data-bs-theme="dark">
        <div class="row card text-bg-dark p-3 mb-3" style="max-width: 100rem; height: 100vh;">
            <div class="card-header">
                <h1>В Меню</h1>
            </div>
            <div class="row card-body mb-5">
                <button type="button" class="btn btn-dark" style="height: 3rem;">Главная</button>
                <button type="button" class="btn btn-dark" style="height: 3rem;">Категории</button>
                <button type="button" class="btn btn-dark" style="height: 3rem;">Заказы</button>
                <button type="button" class="btn btn-dark" style="height: 3rem;">Контакты</button>
                <div class="card-footer position-absolute bottom-0 start-0">
                    <div class="dropup">
                        <button type="button" class="btn btn-grey dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                            Пользователь
                        </button>
                        <ul class="dropdown-menu dropdown-menu-dark">
                            <li><a class="dropdown-item" href="#">Профиль</a></li>
                            <li><a class="dropdown-item" href="#">Выход</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-10 mt-5">
        <div class="row text-center">
            <h1>Контакты</h1>
            <div class="col-5 text-start card m-5 p-3">
                <form method="POST" action="/submit">
                    <div class="mb-3">
                        <label for="name" class="form-label">Имя</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <label for="email" class="form-label">Почта</label>
                    <div class="input-group mb-3">
                        <span class="input-group-text" id="basic-addon1">@</span>
                        <input type="email" class="form-control" id="email" name="email" aria-label="Username" aria-describedby="basic-addon1" required>
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Сообщение</label>
                        <textarea class="form-control" id="message" name="message" rows="2" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Отправить</button>
                </form>
            </div>
            <div class="col-5 mt-5 text-start">
                <h4>Наши контакты</h4>
                <p>
                    Здесь отображаются данные наших сотрудников, такие как ФИО, а также почты и номера телефонов,
                    по которым вы можете связаться со специалистами в случае возникновения вопросов.
                </p>
                <div class="mt-2">
                    <p>
                        Спасибо, что выбрали нашу продукцию!
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
